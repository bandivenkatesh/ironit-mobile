name: ironit
description: Premium on-demand ironing service for Hyderabad with professional-grade Flutter implementation
version: 0.1.0+1
homepage: https://github.com/bandivenkatesh/ironit-mobile
repository: https://github.com/bandivenkatesh/ironit-mobile
issue_tracker: https://github.com/bandivenkatesh/ironit-mobile/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.44.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  dio: ^5.4.0
  logger: ^2.0.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
